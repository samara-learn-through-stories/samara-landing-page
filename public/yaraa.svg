<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 280" width="260" height="280" fill="none">
  <!-- Yaraa — idle pose, matches src/mascots/skins/yaraa.js -->
  <defs>
    <radialGradient id="ya-glow-outer" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#ffd98a" stop-opacity="0.16"/>
      <stop offset="65%" stop-color="#e8a84e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e8a84e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ya-glow-core" cx="50%" cy="58%" r="32%">
      <stop offset="0%" stop-color="#fff8dd" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ffd98a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ya-head" cx="0.38" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#f7e8c8"/>
      <stop offset="0.45" stop-color="#d9bd8e"/>
      <stop offset="0.8" stop-color="#8a7350"/>
      <stop offset="1" stop-color="#5a4a34"/>
    </radialGradient>
    <linearGradient id="ya-abdomen" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#b89868"/>
      <stop offset="0.28" stop-color="#c9a868"/>
      <stop offset="0.55" stop-color="#dcb870"/>
      <stop offset="0.75" stop-color="#ffd98a"/>
      <stop offset="0.9" stop-color="#fff0a0"/>
      <stop offset="1" stop-color="#fff8d0"/>
    </linearGradient>
    <radialGradient id="ya-tip" cx="0.5" cy="0.75" r="0.4">
      <stop offset="0" stop-color="#fffef8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff4b8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ya-breath" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffd98a" stop-opacity="0.4"/>
      <stop offset="0.75" stop-color="#ffd98a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft radiance -->
  <circle cx="130" cy="150" r="120" fill="url(#ya-glow-outer)"/>
  <circle cx="130" cy="160" r="70" fill="url(#ya-glow-core)"/>

  <g transform="translate(20, 10)">
    <!-- wings (behind) -->
    <g transform="translate(-18, 73) scale(1.01)">
      <path d="M92,22 Q44,0 18,38 Q10,60 30,68 Q52,62 78,46 Q94,34 92,22 Z" fill="#e8dcc4" opacity="0.22"/>
      <path d="M86,26 Q50,14 30,42" fill="none" stroke="#d4c4a0" stroke-width="1" opacity="0.28"/>
    </g>
    <g transform="translate(136, 73) scale(1.01)">
      <path d="M8,22 Q56,0 82,38 Q90,60 70,68 Q48,62 22,46 Q6,34 8,22 Z" fill="#e8dcc4" opacity="0.22"/>
      <path d="M14,26 Q50,14 70,42" fill="none" stroke="#d4c4a0" stroke-width="1" opacity="0.28"/>
    </g>

    <!-- abdomen -->
    <ellipse cx="110" cy="175" rx="42" ry="58" fill="url(#ya-abdomen)"/>
    <ellipse cx="110" cy="202" rx="28" ry="26" fill="url(#ya-tip)"/>
    <path d="M78,148 Q110,156 142,148" stroke="#6a5030" stroke-width="1.6" fill="none" opacity="0.18" stroke-linecap="round"/>
    <path d="M74,168 Q110,178 146,168" stroke="#6a5030" stroke-width="1.8" fill="none" opacity="0.28" stroke-linecap="round"/>
    <path d="M76,188 Q110,198 144,188" stroke="#5a4028" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round"/>
    <path d="M84,206 Q110,214 136,206" stroke="#4a3820" stroke-width="1.6" fill="none" opacity="0.22" stroke-linecap="round"/>
    <ellipse cx="100" cy="208" rx="8" ry="6" fill="#fff" opacity="0.4"/>
    <ellipse cx="110" cy="168" rx="40" ry="48" fill="url(#ya-breath)"/>

    <!-- head + face (idle) -->
    <circle cx="110" cy="78" r="44" fill="url(#ya-head)"/>
    <ellipse cx="94" cy="60" rx="14" ry="10" fill="#fff" opacity="0.55"/>
    <ellipse cx="80" cy="92" rx="7" ry="4.4" fill="#e8956a" opacity="0.55"/>
    <ellipse cx="140" cy="92" rx="7" ry="4.4" fill="#e8956a" opacity="0.55"/>
    <ellipse cx="94" cy="80" rx="6.5" ry="9" fill="#241a10"/>
    <circle cx="96.5" cy="76" r="2.4" fill="#fff"/>
    <ellipse cx="126" cy="80" rx="6.5" ry="9" fill="#241a10"/>
    <circle cx="128.5" cy="76" r="2.4" fill="#fff"/>
    <path d="M96,98 Q110,108 124,98" fill="none" stroke="#241a10" stroke-width="3.2" stroke-linecap="round"/>

    <!-- antennae -->
    <g transform="translate(44, 5)">
      <path d="M52,46 Q42,16 14,20" fill="none" stroke="#cdb898" stroke-width="4" stroke-linecap="round"/>
      <circle cx="11" cy="19" r="6" fill="#ffd98a"/>
    </g>
    <g transform="translate(119, 5)">
      <path d="M6,46 Q16,16 44,20" fill="none" stroke="#cdb898" stroke-width="4" stroke-linecap="round"/>
      <circle cx="47" cy="19" r="6" fill="#ffd98a"/>
    </g>
  </g>
</svg>
